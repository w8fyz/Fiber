name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Bytecode targets 21 (options.release); also build on the latest JDK.
        java: [21, 25]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: freshapi
          POSTGRES_PASSWORD: freshapi
          POSTGRES_DB: freshapi
        ports:
          - 5440:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5440
      DB_NAME: freshapi
      DB_USER: freshapi
      DB_PASSWORD: freshapi

    steps:
      - uses: actions/checkout@v7

      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle

      - name: Run tests
        run: ./gradlew test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-java${{ matrix.java }}
          path: build/reports/tests/
